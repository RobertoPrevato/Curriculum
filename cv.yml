    description: >-
      Member of the IT Cloud and Strategy team at Demant, with the role of Senior DevOps and Senior Cloud Developer. Key player in delivering web solutions for the entire company and generating cost savings.
      Examples of web applications I developed during this job include:
      <ul>
        <li><strong>HIQMS:</strong> system to store, index, and grant access to QMS documents for the entire company (related to ISO 9000 family compliance). The system comprises a back-end using ASP.NET Core, Azure Storage to store documents and metadata in the most cost-effective way, Azure Search to index uploaded files and provide search functionality, Azure Service Bus for service integrations, and Azure Logic Apps to send email notifications when documents are updated; along with a front-end SPA implemented in React that lets users update documents, upload files, configure a tree view, and download files.</li>
        <li><strong>Signing Service:</strong> web API to generate digital signatures, using RSA keys stored in Azure Key Vault. Service implemented using ASP.NET Core, integrated with company AAD, published in Azure API Management.</li>
        <li><strong>OneCustomer:</strong> web API handling end customers information, integrated with Microsoft Graph API and Azure AAD B2C tenants.</li>
        <li><strong>Account Service:</strong> web service responsible for serving static assets for public-facing pages and HTML bodies of emails sent to Demant's end customers, along with Universal Links configuration for mobile apps (Android and iOS). This service features complex CI and CD pipelines to generate content from HTML templates and locales configured in dedicated files, using a dedicated CLI implemented with Python 3, Click, Jinja2, and other libraries.</li>
        <li><strong>Oticon Medical Software Center</strong> ASP.NET Core API and web portal (React SPA) to handle the software distribution for Oticon Medical.</li>
        <li><strong>Demant Admin Tool</strong> web portal (React SPA), integrated with the OneCustomer API to handle CIAM (Customer Identity and Access Management) for hearing care professionals working with Demant hearing devices.</li>
      </ul>
