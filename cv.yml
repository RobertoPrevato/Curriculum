profile:
  - >
    I currently work as a **Cloud Solution Architect** in the **Cloud Center of
    Excellence** team at **Demant**, a role I was promoted to in February 2022 after
    working as **Senior DevOps** and **Senior Cloud Developer**.

  - >
    - Led **Azure governance** for the global tenant supporting all business units, improving compliance.

    - Acted as **Technical Leader** and handled the design phase for **Azure Landing Zones** with Avanade and Demant stakeholders.

    - Contributed personally to the design and implementation of **Azure Landing Zones** at Demant, including the **Hub & Spoke** network architecture in Azure.

    - Maintained **IaC pipelines** with YAML, Bash, PowerShell, Azure CLI, improving deployment reliability and reducing manual operations.

    - Integrated **Entra ID** with **GitHub Enterprise Managed Users**, enabling centralized identity governance and assigning the first **GitHub Copilot** seats (today almost 600).

    - Developed automation and documentation for the central Demant **API Gateway** (**Azure API Management**).

    - Maintained **IaC pipelines** with YAML, Bash, PowerShell, Azure CLI, improving deployment reliability and reducing manual operations.

  - >
    Before my promotion to the Cloud Architect position, I delivered multiple
    end-to-end web applications and APIs for Demant on Azure, directly enabling
    critical business capabilities:

      - **Signing Service API** (**GxP validated**) — secures firmware integrity at Demant's global production sites for hearing devices through digital signature creation and verification.
      - **Oticon Medical Software Center** — software distribution platform for Oticon Medical (I developed the whole web front-end and web API ground-up, collecting business requirements from stakeholders).
      - **HIQMS** (**GxP validated**) — centralized QMS document management (full web app consisting of front-end and back-end), improving compliance and document accessibility across the company.
      - **Demant Admin Tool** — a web portal to administer Hearing Care Professionals accounts and Hearing Care Businesses (**CIAM** capabilities).
      - **Account WebFace** — enabled localized content delivery to end-customer mobile apps.
      - **Azure API Management automation** — administered personally the automation and deployment for Demant's central API Gateway.
      - And more, omitted for brevity…

    With more than **10 years of experience** building back-ends and front-ends, I bring
    deep expertise in **HTTP web servers**, **web frameworks**, and browsers, consistently
    translating that knowledge into production systems that drive business value.
    **Web development** and **coding** are two of my passions, as demonstrated by my
    <a href="https://github.com/RobertoPrevato">GitHub profile</a> and employment history.

  - >
    I created <a href="https://github.com/Neoteroi/BlackSheep">**BlackSheep**</a>,
    one of today's **most performant web frameworks for Python**, consistently ranking
    among the top performers in **TechEmpower benchmarks** since its first release.
    This achievement led to a collaboration with **Łukasz Langa** (former Python release
    manager and Python Core Developer) and **Yury Selivanov** (also a Python Core developer)
    at **EdgeDB**, where I contributed part-time in 2020 while still working full-time for Demant.

  - >
    At EdgeDB I built a **Contributor License Agreement (CLA) bot** for GitHub that was
    subsequently adopted by the **Python Software Foundation**, streamlining contributor
    onboarding for one of the world's largest open-source communities. The adoption was
    publicly announced by **Yury Selivanov** on Twitter, and the source code remains
    available on GitHub in the EdgeDB organization.

desired_position: >-
  Technical leadership position such as Cloud Solution Architect or Senior Solution Architect,
  contributing to APIs, DevOps, and Cloud governance.

